#
# On every push to master: build the container image of Project Isidore from
# guix.scm on a GitHub-hosted arm64 runner (production is aarch64), push it to
# ghcr.io/bhwdev/project-isidore, and have the production host run it.  The
# deploy key is confined on the host to its deploy hook, which can only pull
# an image of this repository by digest and restart the service.
# README.org, section "Deployment", has the one-time setup.  A push to master
# is a deploy.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bhwdev/project-isidore
  # channels.scm pins the commit of this release, so its binary installation
  # is already the pinned Guix and nothing has to be pulled.
  GUIX_VERSION: 1.5.0
  # Of guix-binary-1.5.0.aarch64-linux.tar.xz, whose signature by Efraim
  # Flashner (A28B F40C 3E55 1372 662D  14F7 41AA E7DC CA3D 8351, a key
  # guix-install.sh trusts) was checked when this was written.
  GUIX_SHA256: a5d58b1d0294cad6adb1f2aff627d37feb5db763fdffbceb8551f2b12123cf39

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Guix
        working-directory: ${{ runner.temp }}
        run: |
          tarball=guix-binary-$GUIX_VERSION.aarch64-linux.tar.xz
          curl -fsSLO --retry 3 "https://ftp.gnu.org/gnu/guix/$tarball"
          echo "$GUIX_SHA256  $tarball" | sha256sum --check
          sudo tar --warning=no-timestamp -C / -xf "$tarball"
          guix=/var/guix/profiles/per-user/root/current-guix
          # The release's guix-daemon.service runs the daemon unprivileged,
          # in user namespaces that Ubuntu's AppArmor policy forbids; on this
          # throwaway VM run it as root with build users instead.
          sudo groupadd --system guixbuild
          for i in 1 2 3 4; do
            sudo useradd --system --gid guixbuild --groups guixbuild \
              --home-dir /var/empty --shell /usr/sbin/nologin "guixbuilder0$i"
          done
          sudo systemd-run --unit=guix-daemon \
            --setenv=GUIX_STATE_DIRECTORY=/var/guix \
            "$guix/bin/guix-daemon" --build-users-group=guixbuild --discover=no \
            --substitute-urls='https://bordeaux.guix.gnu.org https://ci.guix.gnu.org'
          for server in bordeaux.guix.gnu.org ci.guix.gnu.org; do
            sudo "$guix/bin/guix" archive --authorize < "$guix/share/guix/$server.pub"
          done
          for i in $(seq 30); do
            [ -S /var/guix/daemon-socket/socket ] && break
            sleep 1
          done
          echo "$guix/bin" >> "$GITHUB_PATH"
          df -h / /tmp

      # guix.scm's build runs make.lisp and with it the offline test suites.
      # Guix's OpenSSL and glibc look for CA certificates and zoneinfo in
      # their own store directories, so the profile's are linked to the fixed
      # paths production gives in SSL_CERT_* and TZDIR (README.org, step 5).
      - name: Build the image
        id: pack
        run: |
          pack=$(guix pack -f docker \
            --image-tag=project-isidore \
            --entry-point=bin/ProjectIsidore \
            --symlink=/etc/ssl=etc/ssl \
            --symlink=/usr/share/zoneinfo=share/zoneinfo \
            --max-layers=100 \
            --file=guix.scm nss-certs tzdata)
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

      - name: Push to ghcr.io
        id: push
        env:
          PACK: ${{ steps.pack.outputs.pack }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          command -v skopeo > /dev/null || sudo apt-get install --yes skopeo
          echo "$TOKEN" | skopeo login --username "$ACTOR" --password-stdin ghcr.io
          # The policy governs signature checks on the source, here the archive
          # just built; --insecure-policy is the stock policy.json's
          # insecureAcceptAnything without depending on that file being there.
          skopeo --insecure-policy copy --digestfile digest \
            "docker-archive:$PACK" "docker://$IMAGE:$SHA"
          skopeo --insecure-policy copy "docker://$IMAGE:$SHA" "docker://$IMAGE:latest"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The secret and variables below are the environment's, which only
    # master may deploy to.
    environment:
      name: production
      url: https://www.bhw.name
    steps:
      - name: Run the image on oci-a1-flex
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$DEPLOY_HOST" "$IMAGE@$DIGEST"
