#
# On every push to master: have the production host build this commit and
# run it.  The deploy key is confined on the host to its deploy hook, which
# takes only a commit ID: it fetches that commit from GitHub, builds guix.scm
# with the host's own Guix (the build runs the test suites), installs the
# program into a profile and restarts the service.  README.org, section
# "Deployment", has the one-time setup.  A push to master is a deploy.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The secret and variables below are the environment's, which only
    # master may deploy to.
    environment:
      name: production
      url: https://www.bhw.name
    steps:
      - name: Build and run this commit on oci-a1-flex
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          COMMIT: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=60 "root@$DEPLOY_HOST" "$COMMIT"

      # The site answering is the test of the restart; the build cannot run it.
      - name: Check that the site answers
        run: |
          for i in $(seq 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://www.bhw.name/ || true)
            [ "$status" = 200 ] && exit 0
            sleep 5
          done
          echo "https://www.bhw.name/ answered $status, not 200, for 150 s after the deploy"
          exit 1
