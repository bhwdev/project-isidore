# https://docs.gitlab.com/ci/jobs/ssh_keys/
before_script:
  - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host oci-a1-flex\n\tUser root\n\tHostName $PROD_SERVER_IP\n\tIdentityFile ~/.ssh/oracle-vm-key\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - cp "$SSH_PRIVATE_KEY" ~/.ssh/oracle-vm-key
  - chmod 600 ~/.ssh/oracle-vm-key

Deploy:
  image: debian:trixie-slim
  script:
    - apt-get update -yq
    - apt-get install --no-install-recommends -y sbcl cl-consfigurator
    - cp -r /builds/bhw/project-isidore/ /usr/share/common-lisp/source/project-isidore/
    - cd /usr/share/common-lisp/source
    - echo "(require \"asdf\") (asdf:load-system :project-isidore/infra) (project-isidore/infra:oci-a1-flex) " > /usr/share/common-lisp/source/genesis.lisp
    - sbcl --script /usr/share/common-lisp/source/genesis.lisp
